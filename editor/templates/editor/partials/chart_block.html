<div class="p-3 bg-white rounded-lg shadow-sm editor-block" data-block-type="chart" data-id="{{ id|default:'' }}">
    <div class="flex items-start gap-3">
        <span class="drag-handle text-gray-400 hover:text-gray-600 mt-1"><i class="fas fa-grip-vertical text-sm"></i></span>
        <div class="flex-grow space-y-2">
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wide">Chart (HTML Upload)</label>
            {% if chart_url %}
            <p class="text-xs text-gray-400">
                Current file: <a href="{{ chart_url }}" target="_blank" class="text-blue-500 hover:underline">{{ chart_url|slice:":50" }}...</a>
                <br>To replace this chart, choose a new file below.
            </p>
            {% endif %}
            
            <input type="file" name="{{ file_input_name|default:'chart_file' }}" accept=".html" class="block w-full text-sm text-gray-500 file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-medium file:bg-green-50 file:text-green-700 hover:file:bg-green-100"/>
            
            <input type="text" name="title" class="w-full border-gray-200 rounded text-sm py-1.5 px-2" value="{{ title|default:'' }}" placeholder="Chart Title (optional)">
        </div>
        <button type="button" class="delete-block-btn text-gray-400 hover:text-red-400 mt-1"><i class="fas fa-times text-sm"></i></button>
    </div>
</div>
