<div class="p-2 bg-white rounded editor-block" data-block-type="paragraph" data-id="{{ id|default:'' }}">
    <div class="flex items-start gap-2">
        <span class="drag-handle text-gray-300 hover:text-gray-500 mt-2"><i class="fas fa-grip-vertical text-sm"></i></span>
        <div class="flex-grow">
            <textarea class="w-full border-0 outline-none focus:ring-0 tinymce-editor" placeholder="Start typing..." style="background: transparent; min-height: 120px;">{{ value|default:'' }}</textarea>
        </div>
        <button type="button" class="delete-block-btn text-gray-300 hover:text-red-400 mt-2"><i class="fas fa-times text-sm"></i></button>
    </div>
</div>
