<div class="p-3 bg-gray-50 rounded border-l-4 border-blue-400 editor-block" data-block-type="reference" data-id="{{ id|default:'' }}">
    <div class="flex items-start gap-3">
        <span class="drag-handle text-gray-400 hover:text-gray-600 mt-1"><i class="fas fa-grip-vertical text-sm"></i></span>
        <div class="flex-grow space-y-2">
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide">Reference</label>
            <input type="text" name="text" class="w-full border-gray-200 rounded text-sm py-1.5 px-2" value="{{ text|default:'' }}" placeholder="Reference text (e.g., 'Source: The Times of India')">
            <input type="url" name="link" class="w-full border-gray-200 rounded text-sm py-1.5 px-2" value="{{ link|default:'' }}" placeholder="https://... (optional link)">
        </div>
        <button type="button" class="delete-block-btn text-gray-400 hover:text-red-400 mt-1"><i class="fas fa-times text-sm"></i></button>
    </div>
</div>
