<div class="p-2 bg-white rounded editor-block" data-block-type="heading3" data-id="{{ id|default:'' }}">
    <div class="flex items-center gap-2">
        <span class="drag-handle text-gray-300 hover:text-gray-500"><i class="fas fa-grip-vertical text-sm"></i></span>
        <div class="flex-grow">
            <input type="text" class="w-full text-lg font-semibold border-0 outline-none focus:ring-0 p-1" value="{{ value|default:'' }}" placeholder="Heading 3" style="background: transparent;">
        </div>
        <button type="button" class="delete-block-btn text-gray-300 hover:text-red-400"><i class="fas fa-times text-sm"></i></button>
    </div>
</div>
