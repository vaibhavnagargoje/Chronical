<div class="p-3 bg-white rounded-lg shadow-sm editor-block" data-block-type="dynamic-chart" data-id="{{ id|default:'' }}">
    <div class="flex items-start gap-3">
        <span class="drag-handle text-gray-400 hover:text-gray-600 mt-1"><i class="fas fa-grip-vertical text-sm"></i></span>
        <div class="flex-grow space-y-2">
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wide">Dynamic Chart Template</label>

            <select name="template_id" class="w-full border-gray-200 rounded text-sm py-1.5 px-2 dynamic-chart-template-select">
                <option value="">Select chart template...</option>
                {% for template in available_chart_templates %}
                    <option value="{{ template.id }}" {% if chart_template and chart_template.id == template.id %}selected{% endif %}>{{ template.title }}</option>
                {% endfor %}
            </select>

            {% if not available_chart_templates %}
                <p class="text-xs text-amber-600">No chart templates are configured for this chapter yet.</p>
            {% endif %}

            <input
                type="text"
                name="title_override"
                class="w-full border-gray-200 rounded text-sm py-1.5 px-2"
                value="{{ title_override|default:'' }}"
                placeholder="Custom chart title (optional)">

            <p class="text-xs text-gray-400">Leave empty to use template title.</p>
        </div>
        <button type="button" class="delete-block-btn text-gray-400 hover:text-red-400 mt-1"><i class="fas fa-times text-sm"></i></button>
    </div>
</div>
